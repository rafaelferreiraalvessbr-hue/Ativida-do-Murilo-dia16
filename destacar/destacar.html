<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>destacar.html</title>
</head>

<body>

    <h1>destacar.html</h1>

    <p>Escreva um nome e veja ele destacado na lista</p>
    <p>Se o nome não estiver na lista, ou não for exatamente igual, ele não será destacado</p>

    <input type="text" id="nome" onkeyup="destacar()">

    <ol id="lista">
        <li>João</li>
        <li>Márcio</li>
        <li>Fabiana</li>
        <li>Jorge</li>
        <li>Silvana</li>
        <li>Luiz</li>
        <li>Carlos</li>
        <li>Pablo</li>
    </ol>

    <script src="script.js"></script>

</body>

</html>
